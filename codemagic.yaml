# Codemagic builds the iOS app in the cloud (no Mac needed) and uploads it to App Store Connect / TestFlight.
workflows:
  ios-appstore:
    name: Cape Cove iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hamarat ASC   # Codemagic > Team settings > Integrations'daki anahtarın adı (diğer oyunlarla aynı anahtar)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mematiii.capecove
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_VERSION: "1.0"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages
        script: npm install
      - name: Copy fonts
        script: npm run fonts
      - name: Create iOS project
        script: |
          npx cap add ios
          ./scripts/ios-setup.sh
      - name: Icon and splash
        script: npm run assets
      - name: Sync
        script: npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  gamecenter-setup:
    name: Cape Cove Game Center setup
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hamarat ASC
    scripts:
      - name: Create Game Center leaderboards
        script: |
          pip3 install --quiet pyjwt cryptography certifi
          python3 scripts/gamecenter_setup.py
