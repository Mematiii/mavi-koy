<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>[hidden]{display:none!important}html,body{background:#11648f;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}</style></head><body><title>Cape Cove</title>
<link rel="stylesheet" href="fonts/fredoka/600.css"><link rel="stylesheet" href="fonts/fredoka/700.css"><link rel="stylesheet" href="fonts/lilita-one/400.css"><link rel="stylesheet" href="fonts/nunito/600.css"><link rel="stylesheet" href="fonts/nunito/700.css"><link rel="stylesheet" href="fonts/nunito/800.css"><link rel="stylesheet" href="fonts/nunito/900.css">
<style>
/* Layout: one-screen mobile game; HUD on top, swappable screens (town map / merge board), modal layer above. Single bright "seaside toy" look. */
:root{
  --sky:#8fdcf5; --sea:#1f9fd1; --sea-deep:#11648f;
  --sand:#f6dfaa; --board:#d99a58; --cell:#f3cf96; --cell2:#ecc285;
  --wood:#7a3f1b; --ink:#3a2210; --cream:#fff7e8; --paper:#f7e6c8;
  --leaf:#57b947; --leaf-d:#3a8f2f; --gold:#ffc834; --gem:#e04cc4;
  --volt:#ffd21f; --ribbon:#9b2f86; --ribbon-d:#6e1f60;
  --go:#43c23a; --go-d:#2a8e23; --blue:#2f8fe0; --blue-d:#1d64aa; --red:#e5413a;
  --f-display:"Fredoka","Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--f-body);font-weight:800;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;font-weight:900;cursor:pointer;border:0;color:inherit}
button:focus-visible,[data-act]:focus-visible{outline:3px solid #fff;outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:linear-gradient(var(--sky),var(--sea))}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.02em}
.stroke{text-shadow:0 2px 0 rgba(0,0,0,.35),1px 1px 0 rgba(0,0,0,.25),-1px -1px 0 rgba(0,0,0,.15)}

/* ---------- LOADING ---------- */
#loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh max(16px,env(safe-area-inset-right,0px)) 6vh max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 60% at 50% 105%,#ffb36b 0,#ff7d6b 25%,transparent 55%),linear-gradient(#3a2b7a,#7b3f9a 45%,#f08a6a 75%,#ffcf7a);overflow:hidden}
#loading .sun{position:absolute;left:50%;top:58%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(#fff3b0,#ffc04d 60%,transparent 70%);opacity:.9}
#loading .waves{position:absolute;left:-10%;right:-10%;bottom:0;height:30%;background:repeating-linear-gradient(170deg,#1f9fd1 0 18px,#2bb3e2 18px 30px);border-radius:50% 50% 0 0/20% 20% 0 0}
.logo{position:relative;text-align:center;line-height:.85;transform:rotate(-4deg)}
.logo b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(64px,20vw,96px);color:var(--gold);-webkit-text-stroke:3px var(--wood);text-shadow:0 6px 0 var(--wood),0 10px 18px rgba(0,0,0,.35)}
.logo b+b{color:#7ee6ff;font-size:clamp(52px,16vw,78px)}
.logo small{display:block;margin-top:18px;color:#fff;font-size:15px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.ld-bottom{position:relative;width:100%;max-width:340px;text-align:center;color:#fff}
.bar{height:22px;border-radius:12px;background:rgba(0,0,0,.35);border:3px solid #fff;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(#8ef07c,var(--go));border-radius:8px;transition:width .2s}
.ld-pct{margin:6px 0 2px;font-size:16px;font-family:var(--f-display);font-weight:400}
.ld-tip{min-height:2.6em;font-size:13px;opacity:.95}
.ld-id{font-size:10px;opacity:.6;margin-top:6px;font-variant-numeric:tabular-nums}
.tapstart{font-family:var(--f-display);font-weight:400;font-size:26px;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(40,20,5,.55),rgba(40,20,5,0))}
.avatar{position:relative;width:var(--cell,56px);height:var(--cell,56px);flex:none;border-radius:12px;background:linear-gradient(#bfe9ff,#6bc2ef);border:3px solid #fff;display:grid;place-items:center;font-size:26px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.avatar .lvl{position:absolute;left:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:var(--blue);border:2px solid #fff;color:#fff;font-size:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:400}
.avatar svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none}
.pill{position:relative;flex:1;min-width:0;height:36px;border-radius:18px;background:rgba(60,30,10,.65);border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;padding:0 20px 0 24px;color:#fff;font-size:15px;font-family:var(--f-display);font-weight:400;letter-spacing:.02em;font-variant-numeric:tabular-nums;justify-content:center}
.pill .ic{position:absolute;left:-6px;top:50%;transform:translateY(-50%);font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.pill .plus{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--go);border:2px solid #fff;font-size:14px;line-height:15px;color:#fff;padding:0}
.pill small{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);font-size:10px;font-family:var(--f-body);font-weight:800;background:rgba(60,30,10,.75);padding:0 6px;border-radius:6px;white-space:nowrap}
.shopbtn{flex:none;width:var(--cell,56px);height:var(--cell,56px);border-radius:10px;font-size:26px;background:linear-gradient(#ff6b6b,#d63031);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3);padding:0}

/* ---------- SCREENS ---------- */
.screen{position:absolute;inset:0;padding-top:calc(var(--cell,56px) + 16px);display:flex;flex-direction:column}
.screen[hidden]{display:none!important}

/* TOWN */
#town{background:linear-gradient(#8fdcf5 0,#5ec6ec 30%,var(--sea) 100%)}
#map{flex:1;overflow:auto;padding:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
#map::-webkit-scrollbar{display:none}
.island{position:relative;margin:0 0 34px;padding:46px 14px 22px;border-radius:44% 56% 40% 60%/16% 18% 14% 16%;background:radial-gradient(90% 60% at 40% 30%,#8fdc6a,var(--leaf) 55%,var(--leaf-d));box-shadow:0 0 0 10px var(--sand),0 0 0 22px rgba(255,255,255,.35),0 18px 30px rgba(0,0,0,.25)}
.island h3{position:absolute;top:10px;left:50%;transform:translateX(-50%);margin:0;padding:4px 16px;border-radius:10px;background:var(--wood);color:#fff;font-size:17px;white-space:nowrap;box-shadow:0 3px 0 #4d250d}
.island .val{position:absolute;top:44px;right:14px;font-size:11px;color:#fff;background:rgba(0,0,0,.25);border-radius:8px;padding:2px 6px}
.plots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px;margin-top:12px}
.plot{position:relative;aspect-ratio:1.15;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;background:none}
.plot::before{content:"";position:absolute;left:12%;right:12%;bottom:8%;height:42%;background:linear-gradient(135deg,#d9c39a,#b89a68);transform:perspective(200px) rotateX(55deg) rotate(45deg);border-radius:10px;box-shadow:0 6px 0 #8a6d43}
.plot .bld{position:relative;font-size:clamp(46px,14vw,64px);line-height:1;filter:drop-shadow(0 5px 2px rgba(0,0,0,.3));transition:transform .3s}
.plot .tag{position:relative;margin-top:2px;font-size:11px;color:#fff;background:rgba(58,34,16,.8);border-radius:8px;padding:2px 8px;white-space:nowrap}
.plot .stars{position:relative;font-size:11px;letter-spacing:-1px;height:14px}
.plot .up{position:absolute;top:2px;right:6px;background:var(--go);color:#fff;border:2px solid #fff;border-radius:12px;padding:1px 7px;font-size:12px;box-shadow:0 2px 0 var(--go-d);animation:bob 1.6s infinite}
.plot .up.cant{background:#9a8a78;box-shadow:0 2px 0 #6c5f51;animation:none}
@keyframes bob{50%{transform:translateY(-3px)}}
.plot.built .bld{animation:built .6s}
@keyframes built{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.island.locked .plots{filter:grayscale(.6) blur(2px);opacity:.6}
.fogcover{position:absolute;inset:-14px;border-radius:inherit;display:grid;place-items:center;background:radial-gradient(circle at 25% 30%,#fff 0 18%,transparent 19%),radial-gradient(circle at 70% 25%,#fff 0 22%,transparent 23%),radial-gradient(circle at 45% 70%,#fff 0 26%,transparent 27%),radial-gradient(circle at 85% 75%,#fff 0 18%,transparent 19%),rgba(255,255,255,.72)}
.lockbadge{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:3px solid #fff;border-radius:16px;padding:8px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:13px}
.lockbadge b{font-size:30px}
.side{position:absolute;top:70px;display:flex;flex-direction:column;gap:10px;z-index:5}
.side.l{left:max(10px,env(safe-area-inset-left,0px))}.side.r{right:max(10px,env(safe-area-inset-right,0px))}
.ev{position:relative;width:var(--cell,56px);height:var(--cell,56px);border-radius:14px;background:linear-gradient(#fff3c9,#ffd36b);border:3px solid #fff;font-size:28px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25);padding:0}
.ev small{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--ribbon);color:#fff;padding:1px 5px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,40,70,0),rgba(0,40,70,.55))}
.nb{width:52px;height:52px;border-radius:14px;background:linear-gradient(#6fc7ff,var(--blue));border:3px solid #fff;font-size:26px;box-shadow:0 3px 0 var(--blue-d);display:grid;place-items:center;position:relative;padding:0}
.nb.play{margin-left:auto;width:auto;height:64px;padding:0 22px;border-radius:18px;background:linear-gradient(#7de86d,var(--go));box-shadow:0 4px 0 var(--go-d);font-family:var(--f-display);font-weight:400;font-size:26px;color:#fff;gap:6px;display:flex;align-items:center}

/* GAME */
#game{background:linear-gradient(#9ee1f7 0,#bfeaf2 18%,var(--sand) 34%,#e8c98a 100%)}
#topstrip{display:flex;gap:6px;padding:4px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));height:110px;flex:none}
.evgrid{flex:none;display:grid;grid-template-columns:repeat(3,calc(var(--cell,56px) / var(--z,1)));grid-template-rows:repeat(2,calc(var(--cell,56px) / var(--z,1) + 6px));gap:4px 5px;align-self:flex-start;padding:5px 6px 8px;border-radius:16px;background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,40,70,.15),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* Günlük görevler ikonu: panelde ilk ve öne çıkan */
.ev.dtask{background:linear-gradient(#fff2b8,#ffc93c);box-shadow:0 0 0 2px #fff,0 0 12px rgba(255,210,60,.9),0 3px 0 rgba(0,0,0,.25);animation:dtglow 1.8s ease-in-out infinite}
@keyframes dtglow{50%{box-shadow:0 0 0 2px #fff,0 0 20px rgba(255,220,80,1),0 3px 0 rgba(0,0,0,.25)}}
.ev.dtask .medal{font-size:30px;line-height:1;margin-top:-6px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.ev.dtask .dbar{position:absolute;left:5px;right:5px;bottom:9px;height:6px;border-radius:4px;background:rgba(90,50,20,.45);overflow:hidden}
.ev.dtask .dbar i{display:block;height:100%;width:0;background:linear-gradient(#9ff57f,#43c23a)}
.dt-top{position:relative;border-radius:16px;padding:42px 6px 10px;border:3px solid #fff;box-shadow:inset 0 -6px 12px rgba(214,160,70,.35),0 2px 4px rgba(0,0,0,.15);background:linear-gradient(#8fdcf5,#5ec6ec 55%,#f6dfaa);margin-bottom:10px}
.dt-pts{position:absolute;left:10px;top:8px;background:#fff8d6;border-radius:10px;padding:2px 8px;font-size:12px;color:var(--ink)}
.dt-tm{position:absolute;right:10px;top:8px;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 8px;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.dtt{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;background:var(--cream);border-radius:14px;padding:8px;margin-bottom:6px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.dtt.done{opacity:.6}
.dtt .ic{font-size:28px;text-align:center}
.dtt .nm{font-size:13px;color:var(--ink);margin-bottom:4px}
.dtt .rwd{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);background:#fff3d6;border-radius:10px;padding:4px 6px;white-space:nowrap}
.dtt .rwd .ri{width:22px;height:22px}
.dt-days{display:flex;gap:4px;margin-top:8px}
.dt-days button{position:relative;padding:4px 0 2px}
.dt-days button i{display:block;font-style:normal;font-size:9px;font-family:var(--f-body);font-weight:800;line-height:1.1}
.dt-days button.sel{outline:3px solid #fff;outline-offset:1px;box-shadow:0 0 10px rgba(255,255,255,.9)}
.dtt.lock{opacity:.55;filter:grayscale(.4)}
.dt-top.fut{filter:grayscale(.5) brightness(.9)}
.dt-days span,.dt-days button{flex:1;text-align:center;border-radius:10px;padding:4px 0;font-size:10px;line-height:1.1;color:#fff;background:#2f8fe0;font-family:var(--f-display);font-weight:400}
.dt-days button b,.dt-days span b{display:block;font-size:18px;font-weight:400}
.dt-days button.today,.dt-days span.today{background:linear-gradient(#ffd85c,#f2a40e);color:#5a3410;transform:translateY(-3px);box-shadow:0 3px 0 #b8670c}
.dt-days button.past,.dt-days span.past{background:#7fae6f}.dt-days button.fut,.dt-days span.fut{background:#7b8aa0}

.evgrid .ev{width:calc(var(--cell,56px) / var(--z,1));height:calc(var(--cell,56px) / var(--z,1));font-size:28px;border-radius:12px;border-width:2px}
.evgrid .ev small{bottom:-7px;font-size:13px;font-family:var(--f-display);font-weight:400;letter-spacing:.03em;padding:0 6px;border-radius:7px}
/* üst şerit (görev paneli + siparişler) tek parça halinde sağa-sola kayar */
#orders{flex:none;display:flex;gap:6px;padding-bottom:2px;padding-right:12px}
#topstrip{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior:contain;scrollbar-width:none;scroll-behavior:smooth}
#topstrip::-webkit-scrollbar{display:none}
.order{flex:none;position:relative;width:130px;border-radius:14px;background:var(--cream);border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.order .who{position:absolute;left:4px;top:2px;font-size:28px;line-height:1}
.order .nm{margin-left:34px;align-self:flex-start;font-size:13px;color:#8a6a4a;white-space:nowrap}
.order .need{display:flex;gap:3px;margin-top:4px}
.need .ni{position:relative;width:36px;height:36px;border-radius:9px;background:#ead7b4;display:grid;place-items:center;font-size:24px;cursor:pointer;padding:0;border:0}
.need .ni:active{transform:scale(.9)}
.nb.mult{flex-direction:column;gap:0;width:52px!important;padding:0;font-family:var(--f-display);font-weight:400;font-size:16px;color:#fff;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.35);background:linear-gradient(#9be27f,var(--go));box-shadow:0 3px 0 var(--go-d)}
.nb.mult .ri{width:24px;height:24px;margin-bottom:-2px}
.nb.mult.m2{background:linear-gradient(#ffd25c,#f39a1c);box-shadow:0 3px 0 #b8670c}
.nb.mult.m4{background:linear-gradient(#ff7ad0,#d23ba5);box-shadow:0 3px 0 #8f2170;animation:bob 1.2s infinite}
.ibtn.info{background:linear-gradient(#7fd0ff,#2f8fe0);box-shadow:0 2px 0 #1d64aa;width:40px;min-width:40px;padding:0;font-family:Georgia,serif;font-style:italic;font-size:22px}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:6px 0 4px}
.chain .st{position:relative;background:var(--cream);border-radius:12px;padding:6px 2px 4px;text-align:center;font-size:10px;color:#7b5a3a;line-height:1.15;border:2px solid transparent}
.chain .st .ic{width:54px;height:54px;margin:0 auto 2px;display:grid;place-items:center}
.chain .st .ic img{width:100%;height:100%;object-fit:contain}.chain .st .ic .emo{font-size:34px}
.chain .st.unk .ic{filter:brightness(0) opacity(.3)}
.chain .st.cur{border-color:var(--go);background:#eaffdf}
.chain .st.want{border-color:var(--gold);background:#fff4cf}
.chain .st .lvn{position:absolute;left:4px;top:3px;font-size:10px;color:#fff;background:var(--wood);border-radius:6px;padding:0 4px}
.chain .st:not(:nth-child(3n)):not(:last-child)::after{content:"›";position:absolute;right:-8px;top:24px;font-size:18px;color:var(--wood);font-weight:900}
.srcbox{display:flex;align-items:center;gap:10px;background:#e6f4ff;border:2px solid #fff;border-radius:14px;padding:8px 10px;margin:8px 0}
.srcbox .ic{width:58px;height:58px;flex:none;display:grid;place-items:center}.srcbox .ic img{width:100%;height:100%;object-fit:contain}.srcbox .ic .emo{font-size:38px}
.srcbox .t{flex:1;min-width:0;font-size:12px;color:#5b4a3a}.srcbox .t b{display:block;font-size:14px;color:var(--ink)}
.cell.hint::after{content:"";position:absolute;inset:2px;border:3px solid #39c0ff;border-radius:9px;box-shadow:0 0 12px #39c0ff;pointer-events:none;animation:matchp .5s infinite alternate}
.need .ni.ok{background:#c9f0b9}
.need .ni.ok::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:var(--go);color:#fff;font-size:10px;display:grid;place-items:center;border:1.5px solid #fff}
.order .rw{font-size:14px;display:flex;gap:6px;font-variant-numeric:tabular-nums}
.order .give{position:absolute;inset:auto 6px 4px 6px;height:26px;border-radius:9px;background:linear-gradient(#7de86d,var(--go));box-shadow:0 2px 0 var(--go-d);color:#fff;font-family:var(--f-display);font-weight:400;font-size:16px;border:2px solid #fff;padding:0}
.order.done{animation:leave .5s forwards}
@keyframes leave{to{transform:translateY(-120%);opacity:0}}
.order.new{animation:enter .45s}
@keyframes enter{from{transform:scale(.4);opacity:0}}
#boardwrap{flex:none;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:0 max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
#board{--cs:48px;display:grid;grid-template-columns:repeat(7,var(--cs));grid-template-rows:repeat(8,var(--ch,var(--cs)));padding:0;border-radius:10px;background:rgba(190,225,245,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 3px 0 rgba(120,175,210,.45);touch-action:none;position:relative;overflow:hidden}
.cell{position:relative;width:var(--cs);height:var(--ch,var(--cs));background:var(--cell);display:grid;place-items:center}

.ss-bal{margin:0 auto;width:max-content;background:#fff3c4;border-radius:14px;padding:4px 14px;font-size:18px;color:var(--ink)}

function mapApply(){ const m=$('#map'), bm=$('#bigmap'); if(!bm) return; const {W,H,minZ,maxZ}=mapLimits();

function mapZoomAt(f,cx,cy){ const ox=(cx-MV.x)/MV.z, oy=(cy-MV.y)/MV.z; MV.z*=f; const {minZ,maxZ}=mapLimits(); MV.z=Math.min(maxZ,Math.max(minZ,MV.z)); MV.x=cx-ox*MV.z; MV.y=cy-oy*MV.z; mapApply(); }

function mapInit(){ const m=$('#map'); if(m.dataset.zp) return; m.dataset.zp=1; const P=new Map(); let last=null, pinch=null, moved=0;
  m.addEventListener('pointerdown',e=>{ if(e.target.closest('.zoomctl')) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===1){ last={x:e.clientX,y:e.clientY}; moved=0; mapDrag=false; }
    if(P.size===2){ const [a,b]=[...P.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; } });

    if(P.size>=2&&pinch){ const [a,b]=[...P.values()], d=Math.hypot(a.x-b.x,a.y-b.y); mapZoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); pinch.d=d; mapDrag=true; return; }
    if(last){ const dx=e.clientX-last.x, dy=e.clientY-last.y; moved+=Math.abs(dx)+Math.abs(dy); if(moved>8){ mapDrag=true; if(!m.hasPointerCapture(e.pointerId)) try{m.setPointerCapture(e.pointerId)}catch(_){} } MV.x+=dx; MV.y+=dy; last={x:e.clientX,y:e.clientY}; mapApply(); } });

    const cleared=[]; neighbors(b).forEach(j=>{ if(S.fog[j]){S.fog[j]=false; cleared.push(j); if(S.board[j]) S.board[j].lock=1;} });
    setTimeout(()=>cleared.forEach(j=>{ const ce=boardEl().children[j]; if(ce){ puffAt(ce,7); ce.querySelector('.it')?.animate([{transform:'scale(.5)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:400,easing:'ease-out'}); } }),20);

    const bonus=Math.random()<.012?emptyNear(b):-1; if(bonus>=0) S.board[bonus]={c:Math.random()<.5?'coin':'energy',l:1};

    renderInfo(); renderOrders(); save(); return;

  else if(B.c===A.c && B.l===A.l){toast('This item is already max level ✨'); renderBoard(); return;}
  else {S.board[b]=A; S.board[a]=B; sel=b; renderBoard(); slideFX(b,a); renderInfo(); save(); return;}
  renderBoard(); renderInfo(); save();
}

    // hayalet eşya hedef kareye (geçersizse eski yerine) yapışır, sonra sonuç uygulanır
    const tgt=(d.over!=null&&!S.fog[d.over])?d.over:d.i, r=bd.children[tgt].getBoundingClientRect(), g=d.ghost;

  bd.addEventListener('pointerup',end); bd.addEventListener('pointercancel',end);

/* ---------------- SİPARİŞLER ---------------- */
function makeOrder(s,easy,skip){
  // Kurallar: bir sipariş içinde her ürün farklı üretim yerinden gelir;
  // açık siparişlerde aynı ürün (aynı zincir + seviye) iki kez istenmez.
  const pool=s.unlocked.slice(-ORDER_WINDOW), mL=Math.min(9,1+Math.floor((s.lvl+2)/2));
  const used=new Set((s.orders||[]).filter(o=>o!==skip&&!o.leaving).flatMap(o=>o.need.map(n=>n.c+':'+n.l)));
  let n=easy?1:(Math.random()<.3+s.lvl*.04?2:1); n=Math.min(n,pool.length);
  let need=[];
  for(let t=0;t<60;t++){
    const chains=[...pool].sort(()=>Math.random()-.5).slice(0,n);
    need=chains.map(c=>({c,l:easy?2:Math.min(maxL(c),Math.max(1,mL-rnd(3)))}));
    if(need.every(x=>!used.has(x.c+':'+x.l))) break;
    if(t===40) n=1;   // çok dar havuzda tek ürünlü siparişe düş
  }
  if(need.some(x=>used.has(x.c+':'+x.l))){ // hâlâ çakışıyorsa boşta kalan herhangi bir ürünü seç
    const free=[]; pool.forEach(c=>{for(let l=1;l<=Math.min(mL+1,maxL(c));l++) if(!used.has(c+':'+l)) free.push({c,l});});
    if(free.length) need=[pick(free)];
  }
  const coins=need.reduce((a,x)=>a+ITEM_COIN[x.l],0), xp=need.reduce((a,x)=>a+ITEM_XP[x.l],0);
  const wi=rnd(PEOPLE.length), who=PEOPLE[wi]; return {id:Math.random().toString(36).slice(2),wi,who:who[0],nm:who[1],need,coins,xp,star:Math.random()<.6?1:0};
}
function fixOrders(){ // eski kayıtlardaki kurala aykırı siparişleri yeniler (hazır olanlara dokunmaz)
  const m=boardCounts(), seen=new Set();
  S.orders.forEach((o,k)=>{ const keys=o.need.map(n=>n.c+':'+n.l), chains=o.need.map(n=>n.c);
    const bad=new Set(chains).size<chains.length || keys.some(x=>seen.has(x));
    if(bad && !needStatus(o,m).every(Boolean)){ S.orders[k]=makeOrder(S,false,o); }
    S.orders[k].need.forEach(n=>seen.add(n.c+':'+n.l)); });
}
/* ---------------- YARDIM (takılma skoru) ----------------
   Oyuncu bir siparişte beklenenden çok enerji harcıyorsa, tahta doluysa ya da enerjisi bitiyorsa
   skor yükselir ve oyun sessizce yardım eder. Fiyatlar ve teklifler skordan ETKİLENMEZ. */
const AS=()=>S.as||(S.as={e:0,dry:0,t:now(),h:[],gift:0});
const orderCost=o=>o.need.reduce((a,n)=>a+2**(n.l-1),0);
function assistInfo(){ const A=AS(), open=(S.orders||[]).filter(o=>!o.leaving);
  const cheap=open.length?Math.min(...open.map(orderCost)):4;
  const ratio=A.e/(cheap*1.3+6);
  const free=S.board.filter((it,i)=>!it&&!S.fog[i]).length;
  let close=0; open.forEach(o=>{ let have=0,need=0; o.need.forEach(n=>{ const u=2**(n.l-1); need+=u; let h=0;
      S.board.forEach((it,i)=>{ if(it&&!it.lock&&!S.fog[i]&&it.c===n.c&&it.l<=n.l) h+=2**(it.l-1); }); have+=Math.min(u,h); });
    close=Math.max(close,need?have/need:0); });
  const score=Math.round(Math.max(0,Math.min(100,(ratio-1)*45+(free<4?20:free<8?8:0)+A.dry*15-close*20)));
  const h=A.h.slice(-3), ahead=h.length===3&&h.reduce((a,b)=>a+b,0)/3<.6&&score<15;
  return {score,lv:score>=55?2:score>=25?1:0,ratio,cheap,free,close,dry:A.dry,e:A.e,ahead};}
const assistLevel=()=>assistInfo().lv;
function assistBias(out){ const lv=assistLevel(); if(!lv||Math.random()>=(lv===2?.45:.25)) return out;
  const tg=(S.orders||[]).filter(o=>!o.leaving).flatMap(o=>o.need).filter(n=>n.c===out.c&&n.l>out.l);
  if(!tg.length) return out; const L=Math.min(...tg.map(n=>n.l)); return {c:out.c,l:Math.min(out.l+1,L)}; }
function assistDelivered(){ const A=AS(), i=assistInfo(); A.h.push(+i.ratio.toFixed(2)); A.h=A.h.slice(-5); A.e=0; A.dry=0; A.t=now(); }
function assistGift(){ const A=AS(), lv=assistLevel(); if(!lv||now()-A.gift<30*60e3) return false;
  A.gift=now(); const ok=placeItem({c:'energy',l:lv===2?2:1}); if(!ok) return false;
  toast('A little help arrived! Tap the ⚡ on your board.'); save(); return true; }
function assistPanel(){ const i=assistInfo(), A=AS();
  return `<div class="card" style="font-size:11px;line-height:1.5;margin-top:8px"><b>Assist meter (test)</b><br>
    Stuck score: <b>${i.score}</b>/100 · Help level: <b>${i.lv}</b>${i.ahead?' · ahead (no freebies)':''}<br>
    Energy since last order: ${i.e} · Cheapest order: ${i.cheap} taps · Ratio ${i.ratio.toFixed(2)}<br>
    Free cells: ${i.free} · Out of energy: ${i.dry}× · Closest order: ${Math.round(i.close*100)}%<br>
    Last ratios: ${A.h.join(', ')||'–'}
    <div class="row" style="gap:6px;margin-top:6px;justify-content:center"><button class="btn sm pink" data-act="dbgStuck">Simulate</button><button class="btn sm blue" data-act="dbgReset">Reset</button></div></div>`; }
function boardCounts(){const m={}; S.board.forEach((it,i)=>{ if(it&&!it.lock&&!S.fog[i]){const k=it.c+':'+it.l; m[k]=(m[k]||0)+1;} }); return m;}
function needStatus(o,m){const cp={...m}; return o.need.map(n=>{const k=n.c+':'+n.l; if(cp[k]>0){cp[k]--;return true;} return false;});}
function renderOrders(){
  const m=boardCounts();
  // vermeye hazır siparişler en başa; yeni hazır olan varsa şerit başa kayar
  const list=S.orders.map((o,oi)=>({o,oi,ok:needStatus(o,m).every(Boolean)})).sort((a,b)=>(b.ok-a.ok)||(a.oi-b.oi));
  const readyIds=list.filter(x=>x.ok).map(x=>x.o.id).join(','), newReady=list.some(x=>x.ok&&!(renderOrders.ready||'').split(',').includes(x.o.id)); renderOrders.ready=readyIds;
  if(newReady) requestAnimationFrame(()=>$('#topstrip').scrollTo({left:0}));
  $('#orders').innerHTML=list.map(({o,oi})=>{const st=needStatus(o,m), ok=st.every(Boolean);
    return `<div class="order ${ok?'ready':''} ${o.fresh?'new':''} ${o.leaving?'done':''}" id="ord-${o.id}"><span class="who">${o.wi!=null?IMG('ch_'+o.wi):o.who}</span>
      <div class="box"><div class="need">${o.need.map((n,k)=>`<button class="ni ${st[k]?'ok':''}" data-act="chainInfo" data-c="${n.c}" data-l="${n.l}" data-want="1" aria-label="${CHAINS[n.c].it[n.l-1][0]}">${itemImg(n)}</button>`).join('')}</div>
      <div class="rw"><span>${RICON.coin}${o.coins}</span><span>${RICON.xp}${o.xp}</span>${o.star?`<span>${RICON.star}1</span>`:''}</div>${ok?`<button class="give" data-act="deliver" data-o="${oi}">GIVE</button>`:''}</div></div>`}).join('');
  S.orders.forEach(o=>delete o.fresh);
}
function deliver(oi){
  const o=S.orders[oi]; if(!o) return; const m=boardCounts(); if(!needStatus(o,m).every(Boolean)) return;
  if(o.leaving) return; o.leaving=1; const el=$('#ord-'+o.id), box=el?.querySelector('.box')||el, srcs=[];
  o.need.forEach(n=>{const i=S.board.findIndex((it,j)=>it&&!it.lock&&!S.fog[j]&&it.c===n.c&&it.l===n.l); if(i>=0){ if(sel===i) sel=null; srcs.push([boardEl().children[i],itemImg(S.board[i])]); S.board[i]=null; }});
  // 1) eşyalar tahtadan sipariş kartına uçar  2) kart parlar, ödüller HUD'a akar  3) kart çıkar, yenisi gelir
  srcs.forEach(([c,html],k)=>flyItem(c,box,html,k*90,Math.min(56,c.getBoundingClientRect().width)));
  setTimeout(()=>{ if(box) mergeFX0(box); floatText(box,`+${o.coins}${RICON.coin}`); grant({t:'coin',n:o.coins},box); grant({t:'xp',n:o.xp},box); if(o.star) grant({t:'star',n:1},box); renderHUD(); },520+srcs.length*90);
  S.pass.keys+=8; wk('orders'); setTimeout(gcPush,2000); rollDay(); S.dt.pts+=ORDER_PTS; S.tourn.score+=o.need.reduce((a,n)=>a+10+n.l*5,0);
  setTimeout(()=>{ $('#ord-'+o.id)?.classList.add('done'); },900);
  const aLv=assistLevel(); assistDelivered();
  setTimeout(()=>{const k=S.orders.indexOf(o); const no=makeOrder(S,aLv>=1&&Math.random()<(aLv===2?.6:.35),o); no.fresh=1; if(k>=0) S.orders.splice(k,1,no); renderOrders(); save();},1400);
  renderBoard(); renderInfo(); save();
}

function starParts(){ // açık siparişlerin eksik alt parçaları
  const cnt=boardCounts(), out=[];
  const miss=[]; (S.orders||[]).forEach(o=>o.need.forEach(n=>{const kk=n.c+':'+n.l; if(cnt[kk]>0) cnt[kk]--; else miss.push(n);}));   // önce hazır olanları ayır
  const pool=S.unlocked.slice(-ORDER_WINDOW);   // sadece en son 5 üretim yerinin ürünleri
  miss.filter(n=>pool.includes(n.c)).forEach(n=>{
    if(n.l<=1){ out.push({c:n.c,l:1}); return; }
    const sub=n.c+':'+(n.l-1); if(cnt[sub]>0){cnt[sub]--; out.push({c:n.c,l:n.l-1});}   // tahtadaki eşiyle birleşip tamamlanır
    else out.push({c:n.c,l:Math.max(1,n.l-1)});                                        // parçanın bir kısmı
  });
  return out.slice(0,8);
}

  dtasks:()=>openDT(),
  dtDay:d=>openDT(d.w),
  claimDT:(d,el)=>{ rollDay(); const t=dtTasks((dayId()+3)%7).find(x=>x.k===d.k); if(!t||S.dt.claimed[t.k]) return; S.dt.claimed[t.k]=1; S.dt.pts+=t.pts; grant(t.r,el); floatText(el,`+${t.pts}🏅`); confetti(el,10); save(); renderHUD(); openDT(); },
  claimDTM:(d,el)=>{ rollDay(); const k=+d.k, m=DTM[k]; if(!m||S.dt.mclaimed[k]||S.dt.pts<m.p) return; S.dt.mclaimed[k]=1; grant(m.r,el); confetti(el,16); SFX.up(); save(); renderHUD(); openDT(); },
  claimWT:(d,el)=>{S.weekly.claimed[d.k]=1; confetti(el,10); save(); renderHUD(); openWeekly();},
  claimWM:(d,el)=>{S.weekly.mclaimed[d.k]=1; grant(WM[+d.k].r,el); save(); openWeekly();},
  tourn:()=>openTourn(), stars:()=>openStars(),
  claimStars:(d,el)=>{S.stars-=STAR_GOAL; S.starRounds++; const ps=starParts(); confetti(el,24); closeModal();
    if(!ps.length){[{t:'gift',n:1},{t:'gem',n:5}].forEach(r=>grant(r,el)); save(); return;}
    const from=Math.floor(N/2), spots=[]; let over=0; invLists();
    ps.forEach(it=>{const t=emptyNear(from); if(t<0){S.rewInv.push(it); over++; return;} S.board[t]=it; markDisc(S,it); spots.push(t);});
    if(screen!=='game') show('game');
    setTimeout(()=>{ renderBoard(); spots.forEach((t,k)=>arcSpawn(from,t,k*90)); SFX.spawn(); renderOrders(); renderHUD(); save(); },screen==='game'?0:350);
    toast(`⭐ ${spots.length} order part${spots.length>1?'s':''} landed on the board`+(over?` · ${over} in storage`:'')); save();},
  profile:()=>openProfile(), collection:d=>openCollection(d), album:d=>openAlbum(d), openPack:d=>openPack(d), claimSet:(d,el)=>claimSet(d,el), setDone:d=>claimSet(d), starShop:()=>openStarShop(), buyChest:d=>buyChest(d),
  skipRest:(d,el)=>skipRest(d,el),
  mapZoom:(d)=>{ const m=$('#map'); mapZoomAt(+d.z,m.clientWidth/2,m.clientHeight/2); },
  mult:()=>{ const M=S.mult||1; S.mult=M===1?2:M===2?4:1; setMult(); save(); SFX.coin(); toast(S.mult===1?'Energy x1: normal production':`Energy x${S.mult}: ${S.mult}⚡ per tap, items come out ${Math.log2(S.mult)} level${S.mult>2?'s':''} higher`); },
  chainInfo:d=>openChainInfo(d.c,+d.l,!!d.want), findGen:d=>{closeModal(); if(screen!=='game') show('game'); hintGen(d.c);},
  inventory:()=>{ const sh=$('#invSheet'); if(screen==='game'&&sh&&!sh.hidden) closeInv(); else openInventory(); }, fromInv:d=>fromInv(d), expandInv:()=>expandInv(), invTab:d=>openInventory(d.t), buyBack:d=>buyBack(d),
  building:d=>openBuilding(d), doBuild:d=>doBuild(d),
  deliver:d=>deliver(+d.o), sell:()=>sellSel(), toInv:()=>toInv(),
  claimLevel:(d,el)=>{mOnClose=null; claimLevel(d,el);},
  buyGem:d=>{const p=SHOP.gems.find(x=>x.id===d.id); fakeBuy(`${p.n} · ${p.price}`,[{t:'gem',n:p.amt}]);},
  buyTier:d=>{const k=+d.k, t=OFFER_TIERS[k]; fakeBuy(`Offer tier ${k+1} · ${t.price}`,t.r); pendingBuy={tier:k,r:t.r};},
  confirmBuy:(d,el)=>{const p=pendingBuy; pendingBuy=null; closeModal();
    if(p==='vip'){S.pass.vip=true; toast('👑 VIP Pass active!'); openPass();}
    else if(p&&p.tier!=null){S.tierBought=p.tier+1; p.r.forEach(r=>grant(r,el));}
    else if(Array.isArray(p)) p.forEach(r=>grant(r,el));
    save(); renderHUD();},
  buyEn:(d,el)=>{const p=SHOP.energy.find(x=>x.id===d.id); if(S.gems<p.gem){toast('Not enough gems 💎'); return gemHint();} S.gems-=p.gem;
    if(p.id==='e100') grant({t:'energy',n:100},el); else if(p.id==='echest'){for(let k=0;k<3;k++) placeItem({c:'energy',l:2}); toast('3 🔋 added to the board');} else grant({t:'coin',n:p.amt},el);
    renderHUD(); save(); if(screen==='game'){renderBoard();}},
  setAv:d=>{S.av=+d.a; save(); renderHUD(); openProfile();},
  toggleSound:(d,el)=>{S.sound=!S.sound; el.classList.toggle('on',S.sound); save();},
  toggleVib:(d,el)=>{S.vib=S.vib===false; el.classList.toggle('on',S.vib); save(); if(S.vib) hap('light');},
  toggleNotif:(d,el)=>setNotif(!S.notif,el),
  gcBoard:()=>gcShow(GC_WEEK),
  close:()=>closeModal(),
  saveName:()=>{const v=($('#nameIn')?.value||'').trim(); if(v) S.name=v.slice(0,16); save(); closeModal(); toast('Profile saved');},
  resetAsk:(d,el)=>{ if(el.dataset.sure){ try{localStorage.removeItem(KEY)}catch(e){} S=fresh(); save(); closeModal(); show('town'); toast('New game started'); } else {el.dataset.sure=1; el.textContent='Are you sure?';} },
};
document.addEventListener('pointerdown',e=>{ const sh=$('#invSheet'); if(sh&&!sh.hidden&&!e.target.closest('#invSheet,#invDrop,#modal')) closeInv(); },true);
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'); if(!a||a.disabled) return; const f=ACT[a.dataset.act]; if(f){ f(a.dataset,a,e); }});

/* ---------------- ZAMANLAYICI ---------------- */
setInterval(()=>{ if(!S||$('#hud').hidden) return; tickEnergy(); renderHUD();
  { const rt=$('#restT'), b=rt&&$('#modal [data-act=skipRest]'); if(rt){ const it=S.board[+b.dataset.i]; if(it&&it.cd&&now()<it.cd){ rt.textContent=fmtT((it.cd-now())/1000); b.innerHTML=`Ready now · ${skipCost(it)}${RICON.gem}`; } else closeModal(); } }
  if(screen==='game' && !drag && S.board.some(it=>it&&it.cd&&it.ch<=0)){ renderBoard(); if(sel!=null&&S.board[sel]&&S.board[sel].cd) renderInfo(); }
},1000);
const onResize=()=>{ if(screen==='game'){sizeBoard();} else document.documentElement.style.setProperty('--cell',cellGuess()+'px'); };
addEventListener('resize',onResize); try{ window.visualViewport&&visualViewport.addEventListener('resize',onResize); }catch(_){}

/* ---------------- YÜKLEME & BAŞLANGIÇ ---------------- */
function boot(){
  S=load(); if(typeof S.av!=='number') S.av=0;
  packInit();
  invLists(); if(S.invSize<5) S.invSize=5; { const g=S.inv.filter(it=>it&&CHAINS[it.c]&&CHAINS[it.c].kind==='gen'); if(g.length){ S.genInv.push(...g); S.inv=S.inv.filter(it=>!g.includes(it)); } }
  // eski 12 binalık kasaba anahtarlarını yeni 60 binalık haritaya taşı
  if(!S.map60){ const MV={liman:'sahil',carsi:'sehir',tepe:'luna'}, nb={}; Object.entries(S.bld||{}).forEach(([k,v])=>{const [a,b]=k.split('.'); nb[(MV[a]||a)+'.'+b]=v;}); S.bld=nb; S.map60=1; $('#map').dataset.init=''; }
  // eski kayıtlar: üreticileri yeni 100 dokunuş kuralına geçir
  if(!S.gen100){ S.board.concat(S.inv).forEach(it=>{ if(it&&it.c.startsWith('g_')){ it.ch=GEN_TAPS; it.cd=0; } }); S.gen100=1; }
  // geçilmiş seviyelerin üreticilerini aç (eski kayıtlar için)
  Object.entries(GEN_UNLOCK).forEach(([lv,c])=>{ if(+lv<=S.lvl && !S.unlocked.includes(c)){ S.unlocked.push(c); markDisc(S,{c,l:1},true); placeItem({c:'g_'+c,l:1}); } });
  while(S.orders.length<5) S.orders.push(makeOrder(S));
  fixOrders();
  // eski 7x9 kayıtları 7x8'e uyarla: son satır silinir, içindeki açık eşyalar depoya gider
  // 7x8 kayıtları 7x9'a uyarla: alta bulutlu yeni bir satır eklenir
  if(S.board.length<N){ const add=N-S.board.length; for(let k=0;k<add;k++){ S.board.push(null); S.fog.push(true); } }
  if(S.board.length>N){const extra=S.board.splice(N); S.fog.length=N; extra.forEach(it=>{ if(it&&!it.lock&&S.inv.length<S.invSize) S.inv.push(it); });} rollWeek(); tickEnergy(); save(); setupDrag();
  // görselleri önceden yükle — çubuk gerçek yükleme ilerlemesini izler
  const list=assetList(); let done=0; const t0=now();
  list.forEach(n=>{const im=new Image(); im.onload=im.onerror=()=>done++; im.src=`a/${n}.webp`;});
  $('#ldId').textContent=S.id; let p=0, tipI=rnd(TIPS.length); $('#ldTip').textContent=TIPS[tipI];
  const iv=setInterval(()=>{const real=done/list.length*100, cap=(now()-t0>9000)?100:real; p=Math.min(100,Math.max(p,Math.min(cap,p+3+rnd(7)))); $('#ldFill').style.width=p+'%'; $('#ldPct').textContent=Math.floor(p)+'%';
    if(p%30<8){tipI=(tipI+1)%TIPS.length; $('#ldTip').textContent=TIPS[tipI];}
    if(p>=100){clearInterval(iv); $('#ldBar').hidden=true; $('#ldStart').hidden=false; $('#loading').addEventListener('click',start,{once:true});}},90);
}
function start(){
  const ld=$('#loading'); ld.animate([{opacity:1},{opacity:0}],{duration:350}).onfinish=()=>ld.hidden=true;
  document.documentElement.style.setProperty('--cell',cellGuess()+'px');
  $('#hud').hidden=false; show('town');
  if(S.daily.last!==dayId()) queueModal(()=>openDaily());

  if(S.lvl>(S.lvClaimed||1) ) queueModal(()=>openLevelUp());
}
S=null; boot();
</script>
</body></html>
